services:
  db:
    image: postgres:16-alpine
    container_name: enterprise-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_analytics}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-enterprise_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - enterprise-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise-analytics-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-enterprise_analytics};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - enterprise-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enterprise-analytics-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend
    networks:
      - enterprise-network

volumes:
  pgdata:
    driver: local

networks:
  enterprise-network:
    driver: bridge
